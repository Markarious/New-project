<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./create-account.css">
    <script src="https://kit.fontawesome.com/06bd98d1f1.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="">IT.NET</a>
        </div>
        <ul class="items">
            <li><a href="">Shop</a></li>
            <li><a href="">Categories</a></li>
            <li><a href="">Deals</a></li>
        </ul>
        <div class="icons">
        <a href=""><i class="fa-solid fa-magnifying-glass" style="color: rgb(0, 0, 0);"></i></a>
        <a href=""><i class="fa-solid fa-circle-user" style="color: rgb(0, 0, 0);"></i></a>
        </div>
    </nav>
    <div class="container">
        <h2>Create an Account</h2>
        <form>
            <input type="text" class="fullName" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
            <input type="tel" placeholder="Phone Number" required>
            <textarea placeholder="Address" rows="3" required></textarea>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="../Login wesite/login.html">Login</a>
        </div>
    </div>
    <script src="./create-account.js"></script>
</body>
</html>
